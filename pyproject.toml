[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-rl"
version = "0.1.0"
description = "Tetris RL: Algoritma atau Representasi? CEM vs Deep RL di Tetris"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.2.0",
    "sb3-contrib>=2.2.0",
    "tensorboard>=2.14.0",
    "pygame>=2.5.0",
    "imageio>=2.31.0",
    "matplotlib>=3.7.0",
    "numba>=0.58.0",
    "rliable>=1.0.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tetris_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]



